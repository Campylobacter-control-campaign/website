name: Update public dashboard

on:
  workflow_dispatch:
  schedule:
    # CCC Programme meetings are currently fortnightly on Fridays.
    # GitHub cron cannot express "every other week", so this runs each Friday
    # evening and the first step allows only odd ISO weeks (e.g. 25 Sep 2026,
    # week 39; 9 Oct, week 41) to continue.
    - cron: "17 18 * * 5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check fortnightly programme-meeting cadence
        id: cadence
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          WEEK=$(date -u +%V)
          if [ $((10#$WEEK % 2)) -eq 1 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Odd ISO week $WEEK: scheduled post-meeting dashboard check."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Even ISO week $WEEK: no CCC programme-meeting update expected."
          fi
      - name: Check aggregate feed is configured
        if: steps.cadence.outputs.run == 'true'
        id: feed
        env:
          FEED_URL: ${{ secrets.CCC_DASHBOARD_FEED_URL }}
        run: |
          if [ -z "$FEED_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CCC_DASHBOARD_FEED_URL is not configured; leaving dashboard unchanged."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download aggregate dashboard feed
        if: steps.cadence.outputs.run == 'true' && steps.feed.outputs.configured == 'true'
        env:
          FEED_URL: ${{ secrets.CCC_DASHBOARD_FEED_URL }}
          FEED_TOKEN: ${{ secrets.CCC_DASHBOARD_FEED_TOKEN }}
        run: |
          if [ -n "$FEED_TOKEN" ]; then
            curl --fail --silent --show-error --location --header "Authorization: Bearer $FEED_TOKEN" "$FEED_URL" -o dashboard.next.json
          else
            curl --fail --silent --show-error --location "$FEED_URL" -o dashboard.next.json
          fi
          python scripts/validate_dashboard.py dashboard.next.json
          mv dashboard.next.json dashboard.json
      - name: Validate current dashboard
        if: steps.cadence.outputs.run == 'true'
        run: python scripts/validate_dashboard.py dashboard.json
      - name: Commit changed aggregate data
        if: steps.cadence.outputs.run == 'true' && steps.feed.outputs.configured == 'true'
        run: |
          if git diff --quiet -- dashboard.json; then
            echo "No dashboard changes."
            exit 0
          fi
          git config user.name "ccc-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.json
          git commit -m "Update aggregate dashboard data"
          git push
