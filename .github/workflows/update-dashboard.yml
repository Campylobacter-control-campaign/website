name: Update public dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check aggregate feed is configured
        id: feed
        env:
          FEED_URL: ${{ secrets.CCC_DASHBOARD_FEED_URL }}
        run: |
          if [ -z "$FEED_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CCC_DASHBOARD_FEED_URL is not configured; leaving dashboard unchanged."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download aggregate dashboard feed
        if: steps.feed.outputs.configured == 'true'
        env:
          FEED_URL: ${{ secrets.CCC_DASHBOARD_FEED_URL }}
          FEED_TOKEN: ${{ secrets.CCC_DASHBOARD_FEED_TOKEN }}
        run: |
          if [ -n "$FEED_TOKEN" ]; then
            curl --fail --silent --show-error --location --header "Authorization: Bearer $FEED_TOKEN" "$FEED_URL" -o dashboard.next.json
          else
            curl --fail --silent --show-error --location "$FEED_URL" -o dashboard.next.json
          fi
          python scripts/validate_dashboard.py dashboard.next.json
          mv dashboard.next.json dashboard.json
      - name: Validate current dashboard
        run: python scripts/validate_dashboard.py dashboard.json
      - name: Commit changed aggregate data
        if: steps.feed.outputs.configured == 'true'
        run: |
          if git diff --quiet -- dashboard.json; then
            echo "No dashboard changes."
            exit 0
          fi
          git config user.name "ccc-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.json
          git commit -m "Update aggregate dashboard data"
          git push
